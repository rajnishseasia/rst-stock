name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      
      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.4
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Check types
        run: bun check-types
        
      - name: Run linting
        run: bun lint
        
      - name: Run unit tests
        # Some first-import tests load large broker SDKs. Keep the same
        # timeout as the root `test` script so a cold runner does not turn
        # a healthy test into a 5-second timeout.
        run: bun run test

      - name: Build production artifacts
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          # The Sentry webpack plugin (added with the SDK) pushes the web build
          # past Node's default heap on a runner this size: it died in
          # mark-compact at ~2 GB with "Ineffective mark-compacts near heap
          # limit". Nothing about the app got bigger, the build toolchain did,
          # so raise the ceiling rather than trimming the bundle.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Scan current tree for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          dir --redact=100 --config .gitleaks.toml /repo

  copy-mirror-migration:
    name: Copy mirror migration (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: rst_ci
          POSTGRES_PASSWORD: rst_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rst_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build utilities and database packages
        run: |
          bun --filter @trade-bot/utils build
          bun --filter @trade-bot/db build

      - name: Run copy-mirror migration test
        run: bun test packages/db/scripts/copy-trade-mirror-migration.test.ts
        env:
          COPY_TRADE_MIRROR_MIGRATION_TEST_DATABASE_URL: postgresql://rst_ci:rst_ci_test_password@127.0.0.1:5432/postgres
