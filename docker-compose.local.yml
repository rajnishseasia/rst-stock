services:
  postgres:
    image: postgres:16
    container_name: tradebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradebot
    ports:
      - "5432:5432"
    volumes:
      - tradebot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: tradebot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tradebot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradebot-postgres-data:
  tradebot-redis-data:
